<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHLDL — Salary Cap Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --ice: #EAF3FA;
    --ice-line: #C9DFEF;
    --navy: #0B1F3A;
    --navy-2: #12294D;
    --red: #C8102E;
    --red-soft: #FBE4E7;
    --green: #1B7A4C;
    --green-soft: #E2F4EA;
    --gold: #E8A93A;
    --ink: #0B1F3A;
    --muted: #5A7290;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ice);
    background-image:
      linear-gradient(var(--ice-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--ice-line) 1px, transparent 1px);
    background-size: 48px 48px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 40px 24px 80px; }

  header.top { text-align: center; margin-bottom: 8px; }
  .rink-line {
    height: 6px;
    max-width: 220px;
    margin: 0 auto 20px;
    background: linear-gradient(90deg, transparent, var(--red) 20%, var(--red) 80%, transparent);
    border-radius: 3px;
  }
  .eyebrow {
    font-family: 'Roboto Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(32px, 6vw, 56px);
    letter-spacing: 0.5px;
    margin: 0 0 6px;
    text-transform: uppercase;
  }
  .week-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
    color: #fff;
    background: var(--navy);
    padding: 7px 18px 7px 14px;
    border-radius: 999px;
    margin-top: 10px;
  }
  .week-badge .puck {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--gold);
  }
  .subline {
    color: var(--muted);
    font-size: 14px;
    margin-top: 14px;
  }

  .legend {
    display: flex; justify-content: center; gap: 22px;
    margin: 26px 0 36px;
    font-family: 'Roboto Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.green { background: var(--green); }
  .dot.red { background: var(--red); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--navy);
    border-radius: 14px;
    padding: 18px 18px 16px;
    position: relative;
    overflow: hidden;
    border-left: 5px solid var(--green);
    box-shadow: 0 1px 3px rgba(11,31,58,0.08);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card.over { border-left-color: var(--red); }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(11,31,58,0.22);
  }

  .card-top {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 14px;
  }
  .logo {
    width: 40px; height: 40px; flex-shrink: 0;
    object-fit: contain;
  }
  .team-name {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.3px;
    line-height: 1.15;
  }
  .status-pill {
    margin-left: auto;
    font-family: 'Roboto Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--green-soft);
    color: var(--green);
    white-space: nowrap;
    align-self: flex-start;
  }
  .card.over .status-pill { background: var(--red-soft); color: var(--red); }

  .stat-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 7px 0;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .stat-row:first-of-type { border-top: none; }
  .stat-label {
    font-size: 11px;
    letter-spacing: 0.5px;
    color: rgba(255,255,255,0.55);
    text-transform: uppercase;
  }
  .stat-value {
    font-family: 'Roboto Mono', monospace;
    font-size: 13px;
    color: #fff;
    font-weight: 500;
  }
  .stat-value.negative { color: #FF8B96; }
  .stat-value.flag { color: var(--gold); }

  .foot {
    text-align: center;
    margin-top: 48px;
    font-size: 12px;
    color: var(--muted);
    font-family: 'Roboto Mono', monospace;
  }

  .state-msg {
    text-align: center;
    color: var(--muted);
    font-family: 'Roboto Mono', monospace;
    font-size: 13px;
    padding: 60px 20px;
  }

  @media (max-width: 480px) {
    .wrap { padding: 28px 16px 60px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { padding: 14px 14px 12px; }
    .logo { width: 32px; height: 32px; }
    .team-name { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="rink-line"></div>
    <div class="eyebrow">NHL Dynasty League</div>
    <h1>Salary Cap Tracker</h1>
    <div class="week-badge"><span class="puck"></span><span id="weekLabel">Loading week…</span></div>
    <div class="subline">Live from the league tracker · updates automatically</div>
  </header>

  <div class="legend">
    <span><span class="dot green"></span>Roster legal</span>
    <span><span class="dot red"></span>Over limit</span>
  </div>

  <div id="grid" class="grid">
    <div class="state-msg">Loading team data…</div>
  </div>

  <div class="foot">NHLDL · Data refreshes on page load</div>
</div>

<script>
/* ===================== CONFIG ===================== */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSLNlxzgMDDszhGtpNGKHrj7rF0UxlL7__IExMfyBsM5P-k4KNRp20Zcwhgso_MK3oJ9fGdgawStjd6/pub?gid=958051399&single=true&output=csv";
/* ==================================================== */

const LOGO = {
  "Anaheim Ducks":"ANA","Boston Bruins":"BOS","Buffalo Sabres":"BUF","Calgary Flames":"CGY",
  "Carolina Hurricanes":"CAR","Chicago Blackhawks":"CHI","Colorado Avalanche":"COL","Columbus Blue Jackets":"CBJ",
  "Dallas Stars":"DAL","Detroit Red Wings":"DET","Edmonton Oilers":"EDM","Florida Panthers":"FLA",
  "Los Angeles Kings":"LAK","Minnesota Wild":"MIN","Montreal Canadiens":"MTL","Nashville Predators":"NSH",
  "New Jersey Devils":"NJD","New York Islanders":"NYI","New York Rangers":"NYR","Ottawa Senators":"OTT",
  "Philadelphia Flyers":"PHI","Pittsburgh Penguins":"PIT","San Jose Sharks":"SJS","Seattle Kraken":"SEA",
  "St. Louis Blues":"STL","Tampa Bay Lightning":"TBL","Toronto Maple Leafs":"TOR","Utah Mammoth":"UTA",
  "Vancouver Canucks":"VAN","Vegas Golden Knights":"VGK","Washington Capitals":"WSH","Winnipeg Jets":"WPG"
};

function logoUrl(team) {
  const code = LOGO[team.trim()];
  return code ? `https://assets.nhle.com/logos/nhl/svg/${code}_light.svg` : "";
}

function firstNumber(str) {
  const m = String(str).match(/-?\d+/);
  return m ? parseInt(m[0], 10) : null;
}

function render(rows, weekNum) {
  const grid = document.getElementById('grid');
  const weekLabel = document.getElementById('weekLabel');
  weekLabel.textContent = weekNum ? `Week ${weekNum}` : "Current Week";

  if (!rows.length) {
    grid.innerHTML = '<div class="state-msg">No data found. Check that the sheet is published and has rows.</div>';
    return;
  }

  grid.innerHTML = rows.map(r => {
    const team = (r['Team'] || '').trim();
    if (!team) return '';
    const capSpace = r['Cap Space'] || '';
    const spaceFromFloor = r['Space From Floor'] || '';
    const playersNum = firstNumber(r['Players']);
    const contractsNum = firstNumber(r['Contracts']);
    const over = (playersNum !== null && playersNum > 90) || (contractsNum !== null && contractsNum > 50);
    const capNeg = capSpace.trim().startsWith('-');
    const floorNeg = spaceFromFloor.trim().startsWith('-');

    return `
      <div class="card ${over ? 'over' : ''}">
        <div class="card-top">
          <img class="logo" src="${logoUrl(team)}" alt="${team} logo" onerror="this.style.visibility='hidden'">
          <div class="team-name">${team}</div>
          <div class="status-pill">${over ? 'OVER' : 'LEGAL'}</div>
        </div>
        <div class="stat-row">
          <span class="stat-label">Cap Space</span>
          <span class="stat-value ${capNeg ? 'negative' : ''}">${capSpace}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Space From Floor</span>
          <span class="stat-value ${floorNeg ? 'negative' : ''}">${spaceFromFloor}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Players</span>
          <span class="stat-value ${playersNum > 90 ? 'flag' : ''}">${r['Players'] || ''}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Contracts</span>
          <span class="stat-value ${contractsNum > 50 ? 'flag' : ''}">${r['Contracts'] || ''}</span>
        </div>
      </div>
    `;
  }).join('');
}

function load() {
  Papa.parse(CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: (results) => {
      const rows = results.data;
      const weekNum = rows.length && rows[0]['Week'] ? rows[0]['Week'] : null;
      render(rows, weekNum);
    },
    error: () => {
      document.getElementById('grid').innerHTML =
        '<div class="state-msg">Couldn\'t load data right now. Check the published sheet link and try refreshing.</div>';
    }
  });
}

load();
</script>
</body>
</html>
